
services:
  orquestador:
    build: .
    container_name: airsim-python-orquestador
    ports:
      # Exponer puerto de Flask
      - "5000-5020:5000-5020"
    volumes:
      # Montar la carpeta actual en /app para poder modificar los scripts sin reconstruir la imagen
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Variable para que el código sepa qué misión ejecutar
      - ENTORNO_SITL=${ENTORNO_SITL:-PX4}
      - PYTHONUNBUFFERED=1
