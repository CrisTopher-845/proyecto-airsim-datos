<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS - Misión Autónoma</title>
    <style>
        /* Estilos de la Estación de Control (Dark Mode Industrial) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        h1 { color: #38bdf8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Panel de Estadísticas (Izquierda) */
        .panel-datos {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dato-caja {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }

        .dato-titulo { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .dato-valor { font-size: 24px; font-weight: bold; color: #f1f5f9; font-variant-numeric: tabular-nums; }
        .unidad { font-size: 14px; color: #64748b; font-weight: normal; }

        /* Mapa / Radar (Derecha) */
        .panel-mapa {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: #020617;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            width: 100%;
            max-width: 600px;
            height: 600px;
        }
        
        .leyenda { margin-top: 10px; display: flex; gap: 20px; font-size: 14px; color: #94a3b8; }
        .punto-leyenda { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>Estación de Control Terrestre (GCS)</h1>

    <div class="dashboard">
        <!-- Panel Izquierdo: Telemetría en Vivo -->
        <div class="panel-datos">
            <div class="dato-caja">
                <div class="dato-titulo">Tiempo de Vuelo</div>
                <div class="dato-valor" id="val-tiempo">0.0 <span class="unidad">s</span></div>
            </div>
            <div class="dato-caja">
                <div class="dato-titulo">Altitud (Z)</div>
                <!-- AirSim usa Z negativo para la altura, lo mostramos positivo para el usuario -->
                <div class="dato-valor" id="val-z">0.0 <span class="unidad">m</span></div>
            </div>
            <div class="dato-caja">
                <div class="dato-titulo">Posición X (Norte)</div>
                <div class="dato-valor" id="val-x">0.0 <span class="unidad">m</span></div>
            </div>
            <div class="dato-caja">
                <div class="dato-titulo">Posición Y (Este)</div>
                <div class="dato-valor" id="val-y">0.0 <span class="unidad">m</span></div>
            </div>
            <div class="dato-caja">
                <div class="dato-titulo">Velocidad Actual</div>
                <div class="dato-valor" id="val-vel">0.0 <span class="unidad">m/s</span></div>
            </div>
        </div>

        <!-- Panel Derecho: Radar en Vivo -->
        <div class="panel-mapa">
            <canvas id="radar" width="600" height="600"></canvas>
            <div class="leyenda">
                <div><span class="punto-leyenda" style="background: #38bdf8;"></span> Ruta del Dron</div>
                <div><span class="punto-leyenda" style="background: #f43f5e;"></span> Posición Actual</div>
            </div>
        </div>
    </div>

    <script>
        // Configuración del Radar
        const canvas = document.getElementById('radar');
        const ctx = canvas.getContext('2d');
        const centroX = canvas.width / 2;
        const centroY = canvas.height / 2;
        const escala = 1.2; // Escala de metros a píxeles (ajusta según el tamaño de tu ruta)
        
        let historialRuta = []; // Aquí guardaremos todos los puntos por donde pasa

        // Función para dibujar la cuadrícula del radar
        function dibujarCuadricula() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;

            // Líneas de la cuadrícula
            for(let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Ejes principales (Cruz central)
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(centroX, 0); ctx.lineTo(centroX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, centroY); ctx.lineTo(canvas.width, centroY); ctx.stroke();
        }

        // Función principal: Pedir datos a Python y dibujar
        async function actualizarTelemetria() {
            try {
                // Pedimos los datos a la ruta /api/datos de Flask
                const respuesta = await fetch('/api/datos');
                const datos = await respuesta.json();

                // 1. Actualizar Textos en el Panel
                document.getElementById('val-tiempo').innerHTML = datos.tiempo + ' <span class="unidad">s</span>';
                document.getElementById('val-x').innerHTML = datos.x + ' <span class="unidad">m</span>';
                document.getElementById('val-y').innerHTML = datos.y + ' <span class="unidad">m</span>';
                document.getElementById('val-z').innerHTML = Math.abs(datos.z) + ' <span class="unidad">m</span>'; // Altitud en positivo
                
                // Calcular velocidad combinada (Pitágoras)
                const velocidadReal = Math.sqrt(Math.pow(datos.vel_x, 2) + Math.pow(datos.vel_y, 2)).toFixed(1);
                document.getElementById('val-vel').innerHTML = velocidadReal + ' <span class="unidad">m/s</span>';

                // 2. Dibujar en el Radar
                // En AirSim NED: X es Norte (Arriba/Abajo), Y es Este (Izquierda/Derecha)
                // En Canvas: Y crece hacia abajo. Por lo tanto, restamos el X de AirSim al centro Y del Canvas.
                const posX_canvas = centroX + (datos.y * escala);
                const posY_canvas = centroY - (datos.x * escala);

                // Guardar punto para la línea de la ruta
                historialRuta.push({ x: posX_canvas, y: posY_canvas });

                // Redibujar todo
                dibujarCuadricula();

                // Dibujar línea de la ruta
                if (historialRuta.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#38bdf8'; // Azul claro
                    ctx.lineWidth = 3;
                    ctx.moveTo(historialRuta[0].x, historialRuta[0].y);
                    for (let i = 1; i < historialRuta.length; i++) {
                        ctx.lineTo(historialRuta[i].x, historialRuta[i].y);
                    }
                    ctx.stroke();
                }

                // Dibujar el punto actual del dron (Rojo vibrante)
                ctx.beginPath();
                ctx.arc(posX_canvas, posY_canvas, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#f43f5e'; 
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f43f5e';

            } catch (error) {
                console.error("Esperando conexión con el dron...", error);
            }
        }

        // Ejecutar la actualización cada 500 milisegundos (0.5 segundos)
        setInterval(actualizarTelemetria, 500);
        dibujarCuadricula(); // Dibujar el fondo vacío al cargar
    </script>
</body>
</html>
